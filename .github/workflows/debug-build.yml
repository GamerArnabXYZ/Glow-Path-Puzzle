name: 🔨 Multi-Platform Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Web
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for tagging/releases

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: 🌐 Build Web (HTML Renderer)
        run: flutter build web --release --web-renderer html --base-href "/Glow-Path-Puzzle/"

      - name: 📦 Archive Web Build
        run: tar -czvf web-build.tar.gz -C build/web .

      - name: 🏷️ Handle Release
        run: |
          # Delete existing tag and release if they exist
          gh release delete latest-build --yes || true
          git push origin :refs/tags/latest-build || true
          
          # Create a fresh tag and release
          gh release create latest-build \
            --title "✅ Latest Build (APK & Web)" \
            --notes "Auto-built release from latest code. Includes optimized Web (HTML) and Android APKs." \
            --prerelease \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            web-build.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
