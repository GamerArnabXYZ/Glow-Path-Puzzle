name: 🔨 Advanced Multi-Platform Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build, Deploy & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔨 Build Android APKs (Universal & Split)
        run: |
          # Universal APK
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/GlowPath-Universal.apk
          
          # Split APKs (v7a, v8a, x86_64)
          flutter build apk --release --split-per-abi
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/GlowPath-ARMv7.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/GlowPath-ARMv8.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/GlowPath-x86_64.apk

      - name: 🌐 Build Web (HTML Renderer)
        run: flutter build web --release --web-renderer html --base-href "/Glow-Path-Puzzle/"

      - name: 📦 Archive Web Build
        run: zip -r web-build.zip build/web

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      - name: 🏷️ Handle Release
        run: |
          gh release delete latest-build --yes || true
          git push origin :refs/tags/latest-build || true
          
          gh release create latest-build \
            --title "✅ GlowPath Mega Build" \
            --notes "### 🚀 Release Breakdown\n- **Android:** 4 APK variants (Universal + 3 ABI-specific)\n- **Web:** Hosted on GitHub Pages & attached as ZIP\n- **Renderer:** Optimized HTML for mobile web performance." \
            --prerelease \
            build/app/outputs/flutter-apk/GlowPath-Universal.apk \
            build/app/outputs/flutter-apk/GlowPath-ARMv7.apk \
            build/app/outputs/flutter-apk/GlowPath-ARMv8.apk \
            build/app/outputs/flutter-apk/GlowPath-x86_64.apk \
            web-build.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
