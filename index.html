<!DOCTYPE html>
<html>
<head>
  <base href="/Glow-Path-Puzzle/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Infinite Neon Puzzle Game.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GlowPath">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GlowPath</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #050505;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .loader-container {
      text-align: center;
    }

    .loader {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(0, 255, 255, 0.1);
      border-top: 4px solid #00ffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
      margin-bottom: 20px;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #00ffff;
      font-size: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loader-container" id="loading-indicator">
    <div class="loader"></div>
    <div class="loading-text">Initializing Glow...</div>
  </div>

  <script>
    // Flutter 3.22+ initialization orchestration
    window.addEventListener('load', function() {
      if ('_flutter' in window) {
        _flutter.loader.load({
          onEntrypointLoaded: async function(engineInitializer) {
            const appRunner = await engineInitializer.initializeEngine({
              useColorEmoji: false,
            });

            // Remove the neon loader right before the game canvas renders
            const loader = document.getElementById('loading-indicator');
            if (loader) loader.remove();

            await appRunner.runApp();
          }
        });
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
